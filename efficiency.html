<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fantasy League Dashboard</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border: #334155;
            --badge-bg: #f59e0b;
            --badge-text: #0f172a;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 2rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        h1 {
            color: var(--accent);
            margin-bottom: 0.5rem;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .control-group {
            display: flex;
            gap: 1rem;
            align-items: center;
            flex-wrap: wrap;
        }

        select {
            background: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 0.6rem 1rem;
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
        }

        #status-message {
            text-align: center;
            font-size: 1.2rem;
            color: var(--text-sub);
            margin-top: 3rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .team-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .team-header {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .team-logo {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
            background: var(--border);
        }

        .team-info h3 {
            margin: 0;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .team-info span.team-owner {
            font-size: 0.85rem;
            color: var(--text-sub);
        }

        .stat-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.75rem;
            background: rgba(0,0,0,0.2);
            padding: 0.75rem;
            border-radius: 6px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-sub);
            text-transform: uppercase;
        }

        .stat-value {
            font-size: 1.1rem;
            font-weight: bold;
        }

        .bye-badge {
            background-color: var(--badge-bg);
            color: var(--badge-text);
            font-size: 0.65rem;
            font-weight: bold;
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            display: inline-block;
            vertical-align: middle;
            margin-left: 0.35rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            margin-top: 1rem;
        }

        th, td {
            padding: 0.75rem 1rem;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th {
            background: rgba(0,0,0,0.3);
            color: var(--accent);
        }

        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1 id="league-title">Loading League Data...</h1>
    </header>

    <div id="status-message">Fetching data from GitHub...</div>

    <div id="dashboard" class="hidden">
        <div class="controls">
            <div class="control-group">
                <div>
                    <label for="year-select">Year: </label>
                    <select id="year-select"></select>
                </div>
                <div>
                    <label for="week-select">View Segment: </label>
                    <select id="week-select"></select>
                </div>
            </div>
            <div>
                <label for="view-select">View Style: </label>
                <select id="view-select">
                    <option value="table" selected>Table</option>
                    <option value="cards">Cards</option>
                </select>
            </div>
        </div>

        <div id="table-view">
            <table>
                <thead>
                    <tr>
                        <th>Team</th>
                        <th>Owner</th>
                        <th>Points Scored</th>
                        <th>Optimal Points</th>
                        <th>Bench Points</th>
                        <th>Efficiency</th>
                        <th>Season Total (Scored)</th>
                        <th>Season Total (Optimal)</th>
                    </tr>
                </thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>
        
        <div id="cards-view" class="grid hidden"></div>
    </div>
</div>

<script>
    let rawLeagueData = null;
    let selectedYear = null;
    let currentYearData = null;

    const PLACEHOLDER_LOGO = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48"><circle cx="24" cy="24" r="24" fill="%23334155"/><text x="50%" y="50%" dominant-baseline="central" text-anchor="middle" fill="%2394a3b8" font-size="12" font-family="sans-serif">LOGO</text></svg>';

    window.addEventListener('DOMContentLoaded', () => {
        fetch('./league_data.json')
            .then(response => {
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                return response.json();
            })
            .then(data => {
                rawLeagueData = data;
                initYearSelect();
            })
            .catch(error => {
                console.error("Error loading JSON:", error);
                document.getElementById('status-message').textContent = 
                    "Failed to load 'league_data.json'. Make sure the file exists in the repository root.";
            });
    });

    function initYearSelect() {
        if (!rawLeagueData) return;

        // Support single year object or multi-year object structure
        const years = rawLeagueData.year ? [rawLeagueData.year.toString()] : Object.keys(rawLeagueData).sort((a, b) => b - a);

        const yearSelect = document.getElementById('year-select');
        yearSelect.innerHTML = '';

        years.forEach(year => {
            const opt = document.createElement('option');
            opt.value = year;
            opt.textContent = year;
            yearSelect.appendChild(opt);
        });

        yearSelect.onchange = (e) => loadYear(e.target.value);

        // Auto-select most recent year
        selectedYear = years[0];
        loadYear(selectedYear);
    }

    function loadYear(year) {
        selectedYear = year;
        currentYearData = rawLeagueData.year ? rawLeagueData : rawLeagueData[year];
        if (!currentYearData) return;

        document.getElementById('status-message').classList.add('hidden');
        document.getElementById('league-title').textContent = currentYearData.league_name || `Fantasy League (${year})`;

        buildWeekDropdown();
        document.getElementById('dashboard').classList.remove('hidden');

        // Reset to regular season view on year switch
        renderData('regular_season_totals');
    }

    function buildWeekDropdown() {
        const teams = Object.values(currentYearData.teams || {});
        if (teams.length === 0) return;

        const maxWeeks = Math.max(...teams.map(t => (t.weekly_points || []).length), 0);
        const weekSelect = document.getElementById('week-select');
        weekSelect.innerHTML = '';

        if (maxWeeks === 0) {
            const emptyOpt = document.createElement('option');
            emptyOpt.value = 'regular_season_totals';
            emptyOpt.textContent = 'No Games Played Yet';
            weekSelect.appendChild(emptyOpt);
            return;
        }

        const regSeasonEndWeek = Math.min(14, maxWeeks);
        const seasonOpt = document.createElement('option');
        seasonOpt.value = 'regular_season_totals';
        seasonOpt.textContent = `Regular Season Totals (Weeks 1–${regSeasonEndWeek})`;
        weekSelect.appendChild(seasonOpt);

        for (let i = 1; i <= maxWeeks; i++) {
            const opt = document.createElement('option');
            opt.value = i - 1;
            opt.textContent = `Week ${i}`;
            weekSelect.appendChild(opt);
        }

        if (maxWeeks > 14) {
            const post14Opt = document.createElement('option');
            post14Opt.value = 'post14';
            post14Opt.textContent = `Playoffs Aggregate (Weeks 15–${maxWeeks})`;
            weekSelect.appendChild(post14Opt);
        }

        weekSelect.onchange = (e) => {
            const val = e.target.value;
            renderData(val === 'post14' || val === 'regular_season_totals' ? val : parseInt(val));
        };
        document.getElementById('view-select').onchange = toggleView;
    }

    function sumArrayRange(arr, start, end) {
        if (!arr || !arr.length) return 0;
        return arr.slice(start, end).reduce((sum, val) => sum + (val || 0), 0);
    }

    function renderData(selection) {
        const teams = Object.values(currentYearData.teams || {});
        const cardsContainer = document.getElementById('cards-view');
        const tableBody = document.getElementById('table-body');

        cardsContainer.innerHTML = '';
        tableBody.innerHTML = '';

        teams.forEach(team => {
            const ownerName = team.owner?.[0] 
                ? `${team.owner[0].firstName} ${team.owner[0].lastName}` 
                : 'Unknown';

            const weeklyPoints = team.weekly_points || [];
            const weeklyOptPoints = team.weekly_optimal_points || [];
            const weeklyBenchPoints = team.weekly_bench_points || [];
            const weeklyEfficiency = team.weekly_efficiency || [];

            let pts, optPts, benchPts, eff, seasonPts, seasonOpt;
            let isByeWeek = false;

            if (selection === 'regular_season_totals') {
                const regSeasonLimit = Math.min(14, weeklyPoints.length);
                pts = sumArrayRange(weeklyPoints, 0, regSeasonLimit).toFixed(2);
                optPts = sumArrayRange(weeklyOptPoints, 0, regSeasonLimit).toFixed(2);
                benchPts = sumArrayRange(weeklyBenchPoints, 0, regSeasonLimit).toFixed(2);
                eff = optPts > 0 ? ((pts / optPts) * 100).toFixed(1) : '0.0';

                seasonPts = pts;
                seasonOpt = optPts;
            } else if (selection === 'post14') {
                const totalWeeks = weeklyPoints.length;
                pts = sumArrayRange(weeklyPoints, 14, totalWeeks).toFixed(2);
                optPts = sumArrayRange(weeklyOptPoints, 14, totalWeeks).toFixed(2);
                benchPts = sumArrayRange(weeklyBenchPoints, 14, totalWeeks).toFixed(2);
                eff = optPts > 0 ? ((pts / optPts) * 100).toFixed(1) : '0.0';

                const regSeasonLimit = Math.min(14, totalWeeks);
                seasonPts = sumArrayRange(weeklyPoints, 0, regSeasonLimit).toFixed(2);
                seasonOpt = sumArrayRange(weeklyOptPoints, 0, regSeasonLimit).toFixed(2);
            } else {
                const weekIdx = selection;
                const currentWeekNum = weekIdx + 1;

                pts = weeklyPoints[weekIdx]?.toFixed(2) || '0.00';
                optPts = weeklyOptPoints[weekIdx]?.toFixed(2) || '0.00';
                benchPts = weeklyBenchPoints[weekIdx]?.toFixed(2) || '0.00';
                eff = weeklyEfficiency[weekIdx]?.toFixed(1) || '0.0';

                if (Array.isArray(team.bye_weeks) && team.bye_weeks.includes(currentWeekNum)) {
                    isByeWeek = true;
                }

                seasonPts = sumArrayRange(weeklyPoints, 0, weekIdx + 1).toFixed(2);
                seasonOpt = sumArrayRange(weeklyOptPoints, 0, weekIdx + 1).toFixed(2);
            }

            const byeTagHTML = isByeWeek ? `<span class="bye-badge">BYE WEEK</span>` : '';

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><strong>${team.name}</strong>${byeTagHTML}</td>
                <td>${ownerName}</td>
                <td style="color: var(--accent); font-weight: bold;">${pts}</td>
                <td>${optPts}</td>
                <td>${benchPts}</td>
                <td>${eff}%</td>
                <td style="color: var(--accent); font-weight: bold;">${seasonPts}</td>
                <td>${seasonOpt}</td>
            `;
            tableBody.appendChild(tr);

            const card = document.createElement('div');
            card.className = 'team-card';
            card.innerHTML = `
                <div class="team-header">
                    <img class="team-logo" 
                         src="${team.logo || PLACEHOLDER_LOGO}" 
                         alt="${team.name}" 
                         onerror="this.onerror=null; this.src='${PLACEHOLDER_LOGO}';">
                    <div class="team-info">
                        <h3>${team.name}${byeTagHTML}</h3>
                        <span class="team-owner">${ownerName} (${team.wins ?? 0}-${team.losses ?? 0})</span>
                    </div>
                </div>
                <div class="stat-grid">
                    <div class="stat-item">
                        <span class="stat-label">Points</span>
                        <span class="stat-value" style="color: var(--accent)">${pts}</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Optimal</span>
                        <span class="stat-value">${optPts}</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Bench Pts</span>
                        <span class="stat-value">${benchPts}</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Efficiency</span>
                        <span class="stat-value">${eff}%</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Season Total</span>
                        <span class="stat-value" style="color: var(--accent)">${seasonPts}</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Season Opt</span>
                        <span class="stat-value">${seasonOpt}</span>
                    </div>
                </div>
            `;
            cardsContainer.appendChild(card);
        });
    }

    function toggleView(e) {
        const view = e.target.value;
        if (view === 'cards') {
            document.getElementById('cards-view').classList.remove('hidden');
            document.getElementById('table-view').classList.add('hidden');
        } else {
            document.getElementById('cards-view').classList.add('hidden');
            document.getElementById('table-view').classList.remove('hidden');
        }
    }
</script>

</body>
</html>
