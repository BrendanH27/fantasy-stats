<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>League Efficiency Dashboard</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            max-width: 900px;
            margin: 2rem auto;
            padding: 0 1rem;
            color: #333;
            background-color: #f8f9fa;
        }

        h1 {
            color: #1a1a1a;
            margin-bottom: 1.5rem;
        }

        .controls-container {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        label {
            font-weight: 600;
        }

        select {
            padding: 0.5rem 1rem;
            font-size: 1rem;
            border-radius: 6px;
            border: 1px solid #ccc;
            background-color: #fff;
            cursor: pointer;
        }

        #status-message {
            margin: 1rem 0;
            padding: 0.75rem 1rem;
            border-radius: 6px;
            font-size: 0.95rem;
        }

        #status-message:empty {
            display: none;
        }

        .status-error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .status-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .league-title {
            margin-top: 1.5rem;
            font-size: 1.5rem;
            color: #2c3e50;
        }
    </style>
</head>
<body>

    <h1>League Efficiency Dashboard</h1>

    <!-- Status & Error Reporting Banner -->
    <div id="status-message">Loading league data...</div>

    <!-- Controls -->
    <div class="controls-container">
        <label for="year-select">Select Season:</label>
        <select id="year-select" disabled>
            <option value="">-- Select Year --</option>
        </select>
    </div>

    <!-- Main Output Container -->
    <main id="dashboard-content">
        <h2 id="league-name-heading" class="league-title"></h2>
        <div id="league-data-display"></div>
    </main>

    <script>
        let allLeagueData = null;

        window.addEventListener('DOMContentLoaded', () => {
            const statusMsg = document.getElementById('status-message');

            // Detect if page is being opened directly as a file without a web server
            if (window.location.protocol === 'file:') {
                setStatus("Error: Cannot fetch JSON using file:// protocol. Please run via a local web server (e.g. VS Code Live Server).", "error");
                return;
            }

            fetch('./league_data.json')
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    }
                    return response.json();
                })
                .then(data => {
                    console.log("Loaded JSON successfully:", data);
                    allLeagueData = data;
                    initYearSelector();
                })
                .catch(error => {
                    console.error("Error loading JSON:", error);
                    setStatus(`Failed to load 'league_data.json': ${error.message}`, "error");
                });
        });

        function initYearSelector() {
            if (!allLeagueData) return;

            // 1. Unwrap data if nested under a root property like 'data' or 'leagues'
            let dataRoot = allLeagueData;
            if (dataRoot.data && typeof dataRoot.data === 'object') {
                dataRoot = dataRoot.data;
            }

            // 2. Extract year keys whether the JSON root is an Object or an Array
            let years = [];

            if (Array.isArray(dataRoot)) {
                // Handle array formats: [{ year: 2025, ... }] or [{ season: "2025", ... }]
                years = dataRoot
                    .map(item => parseInt(item.year || item.season, 10))
                    .filter(y => !isNaN(y));
            } else if (typeof dataRoot === 'object' && dataRoot !== null) {
                // Handle standard object format: { "2025": { ... }, "2024": { ... } }
                years = Object.keys(dataRoot)
                    .map(y => parseInt(y, 10))
                    .filter(y => !isNaN(y));
            }

            // 3. Remove duplicates and sort descending (most recent first)
            years = [...new Set(years)].sort((a, b) => b - a);

            // 4. Handle empty/invalid years
            if (years.length === 0) {
                console.warn("No numeric year keys found. Top-level keys available:", Object.keys(dataRoot));
                setStatus("No valid season year data found in JSON.", "error");
                return;
            }

            // Clear status message on success
            clearStatus();

            // 5. Populate and enable Year Dropdown
            const yearSelect = document.getElementById('year-select');
            yearSelect.innerHTML = years
                .map(y => `<option value="${y}">${y}</option>`)
                .join('');
            
            yearSelect.disabled = false;

            // Event listener to render content when year changes
            yearSelect.addEventListener('change', (e) => {
                displayYearData(e.target.value);
            });

            // Display data for the most recent year by default
            displayYearData(years[0]);
        }

        function displayYearData(year) {
            const leagueNameHeading = document.getElementById('league-name-heading');
            const dataDisplay = document.getElementById('league-data-display');

            // Handle nested vs direct root lookup
            let yearData = allLeagueData[year] || (allLeagueData.data && allLeagueData.data[year]);

            if (!yearData) {
                leagueNameHeading.textContent = "";
                dataDisplay.textContent = "No data found for selected year.";
                return;
            }

            // Display League Name if available
            leagueNameHeading.textContent = yearData.league_name || `Season ${year}`;

            // Render details/teams overview (Modify as needed for your UI)
            dataDisplay.innerHTML = `<p>Successfully loaded data for <strong>${year}</strong>.</p>`;
        }

        function setStatus(message, type) {
            const statusMsg = document.getElementById('status-message');
            if (statusMsg) {
                statusMsg.textContent = message;
                statusMsg.className = type === 'error' ? 'status-error' : 'status-success';
            }
        }

        function clearStatus() {
            const statusMsg = document.getElementById('status-message');
            if (statusMsg) {
                statusMsg.textContent = '';
                statusMsg.className = '';
            }
        }
    </script>
</body>
</html>
