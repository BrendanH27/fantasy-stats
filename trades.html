<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fantasy League - Trade History</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-hover: #27354f;
            --accent: #38bdf8;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border: #334155;
            --badge-bg: #f59e0b;
            --badge-text: #0f172a;
            --error-bg: #450a0a;
            --error-text: #fca5a5;
            --error-border: #7f1d1d;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 2rem;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 2rem;
        }
        h1 {
            color: var(--accent);
            margin-bottom: 0.5rem;
        }
        .back-link {
            display: inline-block;
            color: var(--text-sub);
            text-decoration: none;
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }
        .back-link:hover {
            color: var(--accent);
        }
        /* Controls */
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .control-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        select {
            background: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 0.6rem 1rem;
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
            cursor: pointer;
        }
        /* Status & Empty states */
        #status-message {
            text-align: center;
            font-size: 1.1rem;
            color: var(--text-sub);
            margin-top: 3rem;
            padding: 2rem;
            border-radius: 8px;
            background: var(--card-bg);
            border: 1px solid var(--border);
        }
        .status-error {
            background-color: var(--error-bg);
            color: var(--error-text);
            border: 1px solid var(--error-border);
        }
        .hidden {
            display: none !important;
        }
        /* Trades Grid/List */
        .trades-container {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        .trade-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            transition: background-color 0.2s, border-color 0.2s;
        }
        .trade-card:hover {
            background: var(--card-hover);
            border-color: var(--accent);
        }
        .trade-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 1rem;
            margin-bottom: 1.25rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .trade-teams {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--text-main);
        }
        .trade-teams span {
            color: var(--accent);
        }
        .trade-meta {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .trade-week {
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent);
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }
        .click-hint {
            font-size: 0.8rem;
            color: var(--text-sub);
        }
        /* Assets Grid Layout */
        .trade-assets-grid {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 1.5rem;
            align-items: center;
        }
        @media (max-width: 768px) {
            .trade-assets-grid {
                grid-template-columns: 1fr;
            }
            .trade-arrow {
                text-align: center;
                transform: rotate(90deg);
                margin: 0.5rem 0;
            }
        }
        .asset-box {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
        }
        .asset-box h4 {
            margin: 0 0 0.75rem 0;
            font-size: 0.9rem;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .player-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 0.6rem 0.8rem;
            border-radius: 6px;
            margin-bottom: 0.5rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .player-item:last-child {
            margin-bottom: 0;
        }
        .player-name {
            font-weight: 500;
        }
        .player-points {
            font-size: 0.85rem;
            color: var(--text-sub);
        }
        .trade-arrow {
            text-align: center;
            font-size: 1.5rem;
            color: var(--text-sub);
        }

        /* Expanded Details Drawer */
        .trade-details-drawer {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out, margin-top 0.3s ease-out;
            border-top: 0px solid var(--border);
            margin-top: 0;
        }
        .trade-card.expanded .trade-details-drawer {
            max-height: 1200px;
            margin-top: 1.5rem;
            border-top: 1px solid var(--border);
            padding-top: 1.25rem;
            transition: max-height 0.5s ease-in, margin-top 0.3s ease-in;
        }
        .details-section-title {
            font-size: 1rem;
            color: var(--accent);
            margin-bottom: 1rem;
            font-weight: bold;
        }
        .player-stat-row {
            background: rgba(0,0,0,0.25);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.85rem;
            margin-bottom: 0.75rem;
        }
        .player-stat-header {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
        }
        .stats-breakdown-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            font-size: 0.85rem;
        }
        @media(max-width: 600px) {
            .stats-breakdown-grid {
                grid-template-columns: 1fr;
            }
        }
        .stat-subblock {
            background: var(--card-bg);
            padding: 0.5rem 0.75rem;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.03);
        }
        .stat-subblock-title {
            color: var(--text-sub);
            text-transform: uppercase;
            font-size: 0.7rem;
            margin-bottom: 0.25rem;
            letter-spacing: 0.05em;
        }
        .weekly-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 0.25rem;
            margin-bottom: 0.35rem;
        }
        .pill {
            background: rgba(56, 189, 248, 0.15);
            color: var(--text-main);
            padding: 0.15rem 0.45rem;
            border-radius: 4px;
            font-size: 0.75rem;
        }
        .pill.bye {
            background-color: var(--badge-bg);
            color: var(--badge-text);
            font-weight: bold;
            padding: 0.15rem 0.5rem;
            letter-spacing: 0.05em;
        }
        .summary-line {
            color: var(--accent);
            font-weight: bold;
            margin-top: 0.25rem;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="./index.html" class="back-link">&larr; Back to Main Dashboard</a>
        <header>
            <h1 id="league-title">League Trade History</h1>
        </header>

        <div class="controls">
            <div class="control-group hidden" id="year-select-container">
                <label for="year-select">Season: </label>
                <select id="year-select"></select>
            </div>
        </div>

        <div id="status-message">Loading trade data...</div>
        <div id="trades-wrapper" class="hidden">
            <div id="trades-list" class="trades-container"></div>
        </div>
    </div>

    <script>
        let rawJSONData = null;
        let activeYearData = null;

        function escapeHTML(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        window.addEventListener('DOMContentLoaded', () => {
            if (window.location.protocol === 'file:') {
                showStatus("Cannot fetch JSON using file:// protocol. Please open via local web server (e.g., Live Server).", true);
                return;
            }
            fetch('./league_data.json')
                .then(response => {
                    if (!response.ok) throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    return response.json();
                })
                .then(data => {
                    rawJSONData = data;
                    initYearSelector();
                })
                .catch(error => {
                    console.error("Error loading JSON:", error);
                    showStatus(`Failed to load 'league_data.json': ${error.message}`, true);
                });
        });

        function showStatus(msg, isError = false) {
            const statusMsg = document.getElementById('status-message');
            statusMsg.textContent = msg;
            statusMsg.classList.toggle('status-error', isError);
            statusMsg.classList.remove('hidden');
            document.getElementById('trades-wrapper').classList.add('hidden');
        }

        function initYearSelector() {
            let rootData = rawJSONData.data || rawJSONData;
            let years = [];

            if (!Array.isArray(rootData) && typeof rootData === 'object') {
                const keys = Object.keys(rootData);
                years = keys.filter(k => !isNaN(parseInt(k, 10))).sort((a, b) => b - a);
            }

            const yearSelectContainer = document.getElementById('year-select-container');
            const yearSelect = document.getElementById('year-select');

            if (years.length > 0) {
                yearSelect.innerHTML = years.map(y => `<option value="${y}">Season ${y}</option>`).join('');
                yearSelectContainer.classList.remove('hidden');
                yearSelect.onchange = (e) => {
                    activeYearData = rootData[e.target.value];
                    renderTrades();
                };
                activeYearData = rootData[years[0]];
            } else {
                activeYearData = rootData;
                yearSelectContainer.classList.add('hidden');
            }

            if (activeYearData.league_name) {
                document.getElementById('league-title').textContent = `${activeYearData.league_name} - Trades`;
            }

            renderTrades();
        }

        /**
         * Calculates total points, average per active game, and counts bye weeks.
         */
        function calcStats(pointsArray, byeWeekNum, startWeekNum) {
            if (!pointsArray || pointsArray.length === 0) return { total: '0.00', avg: '0.00', games: 0, byes: 0 };
            
            let total = 0;
            let countedGames = 0;
            let byeCount = 0;

            pointsArray.forEach((val, idx) => {
                const absoluteWeekNum = startWeekNum + idx;
                const score = val || 0;

                if (byeWeekNum && absoluteWeekNum === byeWeekNum) {
                    byeCount += 1;
                    return; // Skip bye week score and denominator count
                }

                total += score;
                countedGames += 1;
            });

            const avg = countedGames > 0 ? total / countedGames : 0;
            return {
                total: total.toFixed(2),
                avg: avg.toFixed(2),
                games: countedGames,
                byes: byeCount
            };
        }

        function renderTrades() {
            const listContainer = document.getElementById('trades-list');
            listContainer.innerHTML = '';

            if (!activeYearData.trades || !Array.isArray(activeYearData.trades) || activeYearData.trades.length === 0) {
                showStatus("No trades recorded for this season.");
                return;
            }

            document.getElementById('status-message').classList.add('hidden');
            document.getElementById('trades-wrapper').classList.remove('hidden');

            activeYearData.trades.forEach((trade) => {
                const playerMap = {};
                if (trade.playerInfo) {
                    trade.playerInfo.forEach(p => { playerMap[p.playerId] = p; });
                }

                const team1Name = escapeHTML(trade.team1Name || `Team ${trade.team1id}`);
                const team2Name = escapeHTML(trade.team2Name || `Team ${trade.team2id}`);
                const tradeWeek = trade.WeekofTrade === 100 ? 100 : parseInt(trade.WeekofTrade, 10);
                const weekLabel = tradeWeek === 100 ? 'Offseason / Preseason' : `Week ${tradeWeek}`;

                function renderPlayerList(playerIds) {
                    if (!playerIds || playerIds.length === 0) return '<em style="color:var(--text-sub)">None / Draft Picks Only</em>';
                    return playerIds.map(id => {
                        const info = playerMap[id];
                        const name = info ? escapeHTML(info.playerName) : `Player ID: ${id}`;
                        
                        let ptsText = '';
                        if (info && info.pretradePoints && info.pretradePoints.length > 0) {
                            const stats = calcStats(info.pretradePoints, info.byeWeek, 1);
                            ptsText = `<span class="player-points">(${stats.total} pts prior | Avg: ${stats.avg})</span>`;
                        }
                        return `<div class="player-item"><span class="player-name">${name}</span> ${ptsText}</div>`;
                    }).join('');
                }

                let detailedPlayersHTML = '';
                if (trade.playerInfo && trade.playerInfo.length > 0) {
                    detailedPlayersHTML = trade.playerInfo.map(p => {
                        const bye = p.byeWeek ? parseInt(p.byeWeek, 10) : 0;
                        const preStartWeek = 1;
                        const postStartWeek = tradeWeek === 100 ? 1 : tradeWeek + 1;

                        const preStats = calcStats(p.pretradePoints, bye, preStartWeek);
                        const postStats = calcStats(p.posttradePoints, bye, postStartWeek);

                        // Build pills for pretrade points with clear BYE tags
                        const prePills = p.pretradePoints && p.pretradePoints.length > 0 
                            ? p.pretradePoints.map((val, idx) => {
                                const absWk = preStartWeek + idx;
                                const isBye = (bye && absWk === bye);
                                return isBye 
                                    ? `<span class="pill bye" title="Week ${absWk} Bye Week">BYE (Wk ${absWk})</span>` 
                                    : `<span class="pill">${val.toFixed(1)}</span>`;
                              }).join('')
                            : '<em style="color:var(--text-sub)">No data recorded</em>';

                        // Build pills for posttrade points with clear BYE tags
                        const postPills = p.posttradePoints && p.posttradePoints.length > 0 
                            ? p.posttradePoints.map((val, idx) => {
                                const absWk = postStartWeek + idx;
                                const isBye = (bye && absWk === bye);
                                return isBye 
                                    ? `<span class="pill bye" title="Week ${absWk} Bye Week">BYE (Wk ${absWk})</span>` 
                                    : `<span class="pill">${val.toFixed(1)}</span>`;
                              }).join('')
                            : '<em style="color:var(--text-sub)">No data recorded</em>';

                        const preByeNote = preStats.byes > 0 ? ` &bull; <em>(${preStats.byes} bye excluded)</em>` : '';
                        const postByeNote = postStats.byes > 0 ? ` &bull; <em>(${postStats.byes} bye excluded)</em>` : '';

                        return `
                            <div class="player-stat-row">
                                <div class="player-stat-header">
                                    <span>${escapeHTML(p.playerName)}</span>
                                    <span style="color:var(--text-sub); font-size:0.8rem;">Bye Week: ${bye ? `Week ${bye}` : 'None'}</span>
                                </div>
                                <div class="stats-breakdown-grid">
                                    <div class="stat-subblock">
                                        <div class="stat-subblock-title">Pre-Trade Performance</div>
                                        <div class="weekly-pills">${prePills}</div>
                                        <div class="summary-line">Total: ${preStats.total} pts &bull; Avg: ${preStats.avg}/wk${preByeNote}</div>
                                    </div>
                                    <div class="stat-subblock">
                                        <div class="stat-subblock-title">Post-Trade Performance</div>
                                        <div class="weekly-pills">${postPills}</div>
                                        <div class="summary-line">Total: ${postStats.total} pts &bull; Avg: ${postStats.avg}/wk${postByeNote}</div>
                                    </div>
                                </div>
                            </div>
                        `;
                    }).join('');
                } else {
                    detailedPlayersHTML = '<p style="color: var(--text-sub); font-size: 0.9rem;">No granular player performance data attached to this trade.</p>';
                }

                const card = document.createElement('div');
                card.className = 'trade-card';
                card.innerHTML = `
                    <div class="trade-header">
                        <div class="trade-teams"><span>${team1Name}</span> &harr; <span>${team2Name}</span></div>
                        <div class="trade-meta">
                            <span class="trade-week">${weekLabel}</span>
                            <span class="click-hint">&#9660; Click to view stats</span>
                        </div>
                    </div>
                    <div class="trade-assets-grid">
                        <div class="asset-box">
                            <h4>Received by ${team1Name}</h4>
                            ${renderPlayerList(trade.playersToT1)}
                        </div>
                        <div class="trade-arrow">&larr;&rarr;</div>
                        <div class="asset-box">
                            <h4>Received by ${team2Name}</h4>
                            ${renderPlayerList(trade.playersToT2)}
                        </div>
                    </div>
                    <div class="trade-details-drawer">
                        <div class="details-section-title">Player Performance Breakdown (Pre vs Post Trade)</div>
                        ${detailedPlayersHTML}
                    </div>
                `;

                card.addEventListener('click', () => {
                    card.classList.toggle('expanded');
                    const hint = card.querySelector('.click-hint');
                    if (card.classList.contains('expanded')) {
                        hint.innerHTML = '&#9650; Click to collapse';
                    } else {
                        hint.innerHTML = '&#9660; Click to view stats';
                    }
                });

                listContainer.appendChild(card);
            });
        }
    </script>
</body>
</html>
