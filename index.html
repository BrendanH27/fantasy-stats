<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fantasy League Dashboard</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border: #334155;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 2rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        h1 {
            color: var(--accent);
            margin-bottom: 0.5rem;
        }

        /* Controls */
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            gap: 1rem;
            flex-wrap: wrap;
        }

        select {
            background: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 0.6rem 1rem;
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
        }

        /* Loading / Error state */
        #status-message {
            text-align: center;
            font-size: 1.2rem;
            color: var(--text-sub);
            margin-top: 3rem;
        }

        /* Cards Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .team-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .team-header {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .team-logo {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
            background: var(--border);
        }

        .team-info h3 {
            margin: 0;
            font-size: 1.1rem;
        }

        .team-info span {
            font-size: 0.85rem;
            color: var(--text-sub);
        }

        .stat-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.75rem;
            background: rgba(0,0,0,0.2);
            padding: 0.75rem;
            border-radius: 6px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-sub);
            text-transform: uppercase;
        }

        .stat-value {
            font-size: 1.1rem;
            font-weight: bold;
        }

        /* Table View */
        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            margin-top: 1rem;
        }

        th, td {
            padding: 0.75rem 1rem;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th {
            background: rgba(0,0,0,0.3);
            color: var(--accent);
        }

        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1 id="league-title">Loading League Data...</h1>
    </header>

    <div id="status-message">Fetching data from GitHub...</div>

    <div id="dashboard" class="hidden">
        <div class="controls">
            <div>
                <label for="week-select">View Segment: </label>
                <select id="week-select"></select>
            </div>
            <div>
                <label for="view-select">View Style: </label>
                <select id="view-select">
                    <option value="table" selected>Table</option>
                    <option value="cards">Cards</option>
                </select>
            </div>
        </div>

        <div id="table-view">
            <table>
                <thead>
                    <tr>
                        <th>Team</th>
                        <th>Owner</th>
                        <th>Points Scored</th>
                        <th>Optimal Points</th>
                        <th>Bench Points</th>
                        <th>Efficiency</th>
                        <th>Season Total (Scored)</th>
                        <th>Season Total (Optimal)</th>
                    </tr>
                </thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>
        
        <div id="cards-view" class="grid hidden"></div>
    </div>
</div>

<script>
    let leagueData = null;

    // Fetch JSON automatically on page load
    window.addEventListener('DOMContentLoaded', () => {
        fetch('./league_data.json')
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return response.json();
            })
            .then(data => {
                leagueData = data;
                initDashboard();
            })
            .catch(error => {
                console.error("Error loading JSON:", error);
                document.getElementById('status-message').textContent = 
                    "Failed to load 'league_data.json'. Make sure the file exists in the repository root.";
            });
    });

    function initDashboard() {
        if (!leagueData) return;

        // Hide status message
        document.getElementById('status-message').classList.add('hidden');

        // Set League Title
        document.getElementById('league-title').textContent = leagueData.league_name || "Fantasy League";

        const teams = Object.values(leagueData.teams);
        if (teams.length === 0) return;

        const totalWeeks = teams[0].weekly_points.length;
        const weekSelect = document.getElementById('week-select');
        weekSelect.innerHTML = '';

        // Add regular weekly options
        for (let i = 1; i <= totalWeeks; i++) {
            const opt = document.createElement('option');
            opt.value = i - 1; // 0-indexed internally
            opt.textContent = i <= 14 ? `Week ${i}` : `Week ${i} (Playoffs)`;
            weekSelect.appendChild(opt);
        }

        // Add Post-Week 14 (Playoffs Aggregate) Option if data extends beyond week 14
        if (totalWeeks > 14) {
            const post14Opt = document.createElement('option');
            post14Opt.value = 'post14';
            post14Opt.textContent = `Playoffs Aggregate (Weeks 15–${totalWeeks})`;
            weekSelect.appendChild(post14Opt);
        }

        // Add Season Totals option at the very end
        const seasonOpt = document.createElement('option');
        seasonOpt.value = 'season_totals';
        seasonOpt.textContent = `Season Totals (Weeks 1–${totalWeeks})`;
        weekSelect.appendChild(seasonOpt);

        // Show Dashboard
        document.getElementById('dashboard').classList.remove('hidden');

        // Render initial view (Week 1)
        renderData(0);

        // Attach Event Listeners
        weekSelect.onchange = (e) => {
            const val = e.target.value;
            renderData(val === 'post14' || val === 'season_totals' ? val : parseInt(val));
        };
        document.getElementById('view-select').onchange = toggleView;
    }

    function sumArrayRange(arr, start, end) {
        if (!arr) return 0;
        return arr.slice(start, end).reduce((sum, val) => sum + (val || 0), 0);
    }

    function renderData(selection) {
        const teams = Object.values(leagueData.teams);
        const cardsContainer = document.getElementById('cards-view');
        const tableBody = document.getElementById('table-body');

        cardsContainer.innerHTML = '';
        tableBody.innerHTML = '';

        teams.forEach(team => {
            const ownerName = team.owner?.[0] 
                ? `${team.owner[0].firstName} ${team.owner[0].lastName}` 
                : 'Unknown';

            let pts, optPts, benchPts, eff, seasonPts, seasonOpt;

            if (selection === 'season_totals') {
                // Full Season aggregate calculations
                const totalWeeks = team.weekly_points.length;
                pts = sumArrayRange(team.weekly_points, 0, totalWeeks).toFixed(2);
                optPts = sumArrayRange(team.weekly_optimal_points, 0, totalWeeks).toFixed(2);
                benchPts = sumArrayRange(team.weekly_bench_points, 0, totalWeeks).toFixed(2);
                eff = optPts > 0 ? ((pts / optPts) * 100).toFixed(1) : '0.0';

                seasonPts = pts;
                seasonOpt = optPts;
            } else if (selection === 'post14') {
                // Post Week 14 aggregate calculations
                const totalWeeks = team.weekly_points.length;
                pts = sumArrayRange(team.weekly_points, 14, totalWeeks).toFixed(2);
                optPts = sumArrayRange(team.weekly_optimal_points, 14, totalWeeks).toFixed(2);
                benchPts = sumArrayRange(team.weekly_bench_points, 14, totalWeeks).toFixed(2);
                eff = optPts > 0 ? ((pts / optPts) * 100).toFixed(1) : '0.0';

                // Total season cumulative up through the available weeks
                seasonPts = sumArrayRange(team.weekly_points, 0, totalWeeks).toFixed(2);
                seasonOpt = sumArrayRange(team.weekly_optimal_points, 0, totalWeeks).toFixed(2);
            } else {
                // Single-week view with dynamic cumulative calculations up to selected week
                const weekIdx = selection;
                pts = team.weekly_points[weekIdx]?.toFixed(2) || '0.00';
                optPts = team.weekly_optimal_points[weekIdx]?.toFixed(2) || '0.00';
                benchPts = team.weekly_bench_points[weekIdx]?.toFixed(2) || '0.00';
                eff = team.weekly_efficiency[weekIdx]?.toFixed(1) || '0.0';

                // Dynamic season totals up to selected week (weekIdx + 1)
                seasonPts = sumArrayRange(team.weekly_points, 0, weekIdx + 1).toFixed(2);
                seasonOpt = sumArrayRange(team.weekly_optimal_points, 0, weekIdx + 1).toFixed(2);
            }

            // Render Table View
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><strong>${team.name}</strong></td>
                <td>${ownerName}</td>
                <td style="color: var(--accent); font-weight: bold;">${pts}</td>
                <td>${optPts}</td>
                <td>${benchPts}</td>
                <td>${eff}%</td>
                <td style="color: var(--accent); font-weight: bold;">${seasonPts}</td>
                <td>${seasonOpt}</td>
            `;
            tableBody.appendChild(tr);

            // Render Card View
            const card = document.createElement('div');
            card.className = 'team-card';
            card.innerHTML = `
                <div class="team-header">
                    <img class="team-logo" src="${team.logo || ''}" alt="${team.name}" onerror="this.src='https://via.placeholder.com/48'">
                    <div class="team-info">
                        <h3>${team.name}</h3>
                        <span>${ownerName} (${team.wins}-${team.losses})</span>
                    </div>
                </div>
                <div class="stat-grid">
                    <div class="stat-item">
                        <span class="stat-label">Points</span>
                        <span class="stat-value" style="color: var(--accent)">${pts}</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Optimal</span>
                        <span class="stat-value">${optPts}</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Bench Pts</span>
                        <span class="stat-value">${benchPts}</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Efficiency</span>
                        <span class="stat-value">${eff}%</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Season Total</span>
                        <span class="stat-value" style="color: var(--accent)">${seasonPts}</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Season Opt</span>
                        <span class="stat-value">${seasonOpt}</span>
                    </div>
                </div>
            `;
            cardsContainer.appendChild(card);
        });
    }

    function toggleView(e) {
        const view = e.target.value;
        if (view === 'cards') {
            document.getElementById('cards-view').classList.remove('hidden');
            document.getElementById('table-view').classList.add('hidden');
        } else {
            document.getElementById('cards-view').classList.add('hidden');
            document.getElementById('table-view').classList.remove('hidden');
        }
    }
</script>

</body>
</html>
