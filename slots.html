<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fantasy League - Points Per Slot Dashboard</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border: #334155;
            --error-bg: #450a0a;
            --error-text: #fca5a5;
            --error-border: #7f1d1d;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 2rem;
        }
        .container {
            max-width: 1300px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 2rem;
        }
        h1 {
            color: var(--accent);
            margin-bottom: 0.5rem;
        }
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .control-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        select {
            background: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 0.6rem 1rem;
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
            cursor: pointer;
        }
        #status-message {
            text-align: center;
            font-size: 1.1rem;
            color: var(--text-sub);
            margin-top: 3rem;
            padding: 1rem;
            border-radius: 8px;
        }
        .status-error {
            background-color: var(--error-bg);
            color: var(--error-text);
            border: 1px solid var(--error-border);
        }
        .table-container {
            overflow-x: auto;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            white-space: nowrap;
        }
        th, td {
            padding: 0.75rem 1rem;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        th {
            background: rgba(0,0,0,0.3);
            color: var(--accent);
            position: sticky;
            top: 0;
            cursor: pointer;
            user-select: none;
        }
        th:hover {
            background: rgba(56, 189, 248, 0.1);
        }
        th::after {
            content: ' ↕';
            font-size: 0.8rem;
            opacity: 0.5;
        }
        tr:hover td {
            background: rgba(56, 189, 248, 0.05);
        }
        .team-col {
            font-weight: bold;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .team-logo {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            background: var(--border);
        }
        /* Cards View Styles */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 1.5rem;
        }
        .team-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .team-card-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.75rem;
        }
        .team-card-logo {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
            background: var(--border);
        }
        .team-card-info h3 {
            margin: 0;
            font-size: 1.1rem;
            color: var(--accent);
        }
        .team-card-info span {
            font-size: 0.85rem;
            color: var(--text-sub);
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1 id="league-title">Points Per Slot Dashboard</h1>
            <p style="color: var(--text-sub); margin: 0;">Analyze performance production breakdown across individual roster positions and slots.</p>
        </header>

        <div id="status-message">Loading slot data...</div>

        <div id="dashboard" class="hidden">
            <div class="controls">
                <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
                    <div class="control-group hidden" id="year-select-container">
                        <label for="year-select">Season: </label>
                        <select id="year-select"></select>
                    </div>
                    <div class="control-group">
                        <label for="week-select">View Segment: </label>
                        <select id="week-select"></select>
                    </div>
                    <div class="control-group">
                        <label for="metric-select">Metric Mode: </label>
                        <select id="metric-select">
                            <option value="totals">Totals</option>
                            <option value="averages">Per-Game Averages</option>
                        </select>
                    </div>
                </div>
                <div class="control-group">
                    <label for="view-select">Layout Style: </label>
                    <select id="view-select">
                        <option value="table" selected>League Table</option>
                        <option value="cards">Per-Team Cards</option>
                    </select>
                </div>
            </div>

            <!-- Table View -->
            <div id="table-view" class="table-container">
                <table>
                    <thead>
                        <tr id="table-head-row">
                            <th data-sort="team">Team</th>
                            <th data-sort="owner">Owner</th>
                        </tr>
                    </thead>
                    <tbody id="table-body"></tbody>
                </table>
            </div>

            <!-- Cards View (Per Team breakdown) -->
            <div id="cards-view" class="grid hidden"></div>
        </div>
    </div>

    <script>
        let rawJSONData = null;
        let activeLeagueData = null;
        let currentSortColumn = null;
        let currentSortAscending = false;

        const PLACEHOLDER_LOGO = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32"><circle cx="16" cy="16" r="16" fill="%23334155"/><text x="50%" y="50%" dominant-baseline="central" text-anchor="middle" fill="%2394a3b8" font-size="10" font-family="sans-serif">LOGO</text></svg>';

        function escapeHTML(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        window.addEventListener('DOMContentLoaded', () => {
            if (window.location.protocol === 'file:') {
                showError("Cannot fetch JSON using file:// protocol. Please open via local web server (e.g., Live Server in VS Code).");
                return;
            }
            fetch('./league_data.json')
                .then(response => {
                    if (!response.ok) throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    return response.json();
                })
                .then(data => {
                    rawJSONData = data;
                    initYearAndDashboard();
                })
                .catch(error => {
                    console.error("Error loading JSON:", error);
                    showError(`Failed to load 'league_data.json': ${error.message}`);
                });
        });

        function showError(msg) {
            const statusMsg = document.getElementById('status-message');
            statusMsg.textContent = msg;
            statusMsg.classList.add('status-error');
            statusMsg.classList.remove('hidden');
            document.getElementById('dashboard').classList.add('hidden');
        }

        function initYearAndDashboard() {
            if (!rawJSONData) return;
            let rootData = rawJSONData.data || rawJSONData;
            let years = [];

            if (!Array.isArray(rootData) && typeof rootData === 'object') {
                const keys = Object.keys(rootData);
                years = keys.filter(k => !isNaN(parseInt(k, 10))).sort((a, b) => b - a);
            }

            const yearSelectContainer = document.getElementById('year-select-container');
            const yearSelect = document.getElementById('year-select');

            if (years.length > 0) {
                yearSelect.innerHTML = years.map(y => `<option value="${y}">Season ${y}</option>`).join('');
                yearSelectContainer.classList.remove('hidden');
                yearSelect.onchange = (e) => {
                    activeLeagueData = rootData[e.target.value];
                    setupWeekSelectorAndRender();
                };
                activeLeagueData = rootData[years[0]];
            } else {
                yearSelectContainer.classList.add('hidden');
                activeLeagueData = rootData;
            }
            setupWeekSelectorAndRender();
        }

        function setupWeekSelectorAndRender() {
            if (!activeLeagueData || !activeLeagueData.teams) {
                showError("JSON structure missing expected 'teams' object.");
                return;
            }

            document.getElementById('status-message').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
            document.getElementById('league-title').textContent = (activeLeagueData.league_name || "Fantasy League") + " - Points Per Slot";

            const teams = Object.values(activeLeagueData.teams);
            if (teams.length === 0) return;

            const totalWeeks = teams[0].slot_points_per_week ? teams[0].slot_points_per_week.length : 0;
            const weekSelect = document.getElementById('week-select');
            weekSelect.innerHTML = '';

            const seasonOpt = document.createElement('option');
            seasonOpt.value = 'season_totals';
            seasonOpt.textContent = `Full Season (Weeks 1–${totalWeeks})`;
            weekSelect.appendChild(seasonOpt);

            for (let i = 1; i <= totalWeeks; i++) {
                const opt = document.createElement('option');
                opt.value = i - 1;
                opt.textContent = `Week ${i}`;
                weekSelect.appendChild(opt);
            }

            renderDashboard();

            weekSelect.onchange = renderDashboard;
            document.getElementById('metric-select').onchange = renderDashboard;
            document.getElementById('view-select').onchange = toggleViewMode;
        }

        function toggleViewMode(e) {
            const mode = e.target.value;
            if (mode === 'cards') {
                document.getElementById('cards-view').classList.remove('hidden');
                document.getElementById('table-view').classList.add('hidden');
            } else {
                document.getElementById('cards-view').classList.add('hidden');
                document.getElementById('table-view').classList.remove('hidden');
            }
            renderDashboard();
        }

        function getOwnerName(team) {
            if (team.owner && team.owner[0]) {
                return `${team.owner[0].firstName || ''} ${team.owner[0].lastName || ''}`.trim() || team.owner[0].displayName || 'Unknown';
            } else if (typeof team.owner === 'string') {
                return team.owner;
            }
            return 'Unknown';
        }

        function renderDashboard() {
            const selection = document.getElementById('week-select').value;
            const metricMode = document.getElementById('metric-select').value;
            const viewMode = document.getElementById('view-select').value;
            const teams = Object.values(activeLeagueData.teams);

            // Discover slot keys dynamically
            let slotKeysSet = new Set();
            teams.forEach(team => {
                if (Array.isArray(team.slot_points_per_week)) {
                    team.slot_points_per_week.forEach(weekObj => {
                        if (weekObj) Object.keys(weekObj).forEach(slot => slotKeysSet.add(slot));
                    });
                }
            });
            const slotKeys = Array.from(slotKeysSet).sort();

            if (viewMode === 'table') {
                renderTableView(teams, slotKeys, selection, metricMode);
            } else {
                renderCardsView(teams, slotKeys, selection, metricMode);
            }
        }

        function renderTableView(teams, slotKeys, selection, metricMode) {
            const theadRow = document.getElementById('table-head-row');
            theadRow.innerHTML = `
                <th data-sort="team">Team</th>
                <th data-sort="owner">Owner</th>
                ${slotKeys.map(slot => `<th data-sort="${slot}">${escapeHTML(slot)}</th>`).join('')}
                <th data-sort="grandTotal" style="color: var(--accent);">${metricMode === 'averages' ? 'Avg Total' : 'Total Slot Pts'}</th>
            `;

            // Attach sorting events to headers
            theadRow.querySelectorAll('th').th.forEach = undefined; // safety
            theadRow.querySelectorAll('th').forEach(th => {
                th.onclick = () => {
                    const sortKey = th.getAttribute('data-sort');
                    if (currentSortColumn === sortKey) {
                        currentSortAscending = !currentSortAscending;
                    } else {
                        currentSortColumn = sortKey;
                        currentSortAscending = false; // default high-to-low for points
                    }
                    renderDashboard();
                };
            });

            // Process data per team
            let processedTeams = teams.map(team => {
                let computedSlots = {};
                slotKeys.forEach(k => computedSlots[k] = 0);
                let weeksCount = 0;
                let grandTotal = 0;

                if (selection === 'season_totals') {
                    if (Array.isArray(team.slot_points_per_week)) {
                        team.slot_points_per_week.forEach(weekObj => {
                            if (weekObj) {
                                weeksCount++;
                                for (let [slot, pts] of Object.entries(weekObj)) {
                                    computedSlots[slot] = (computedSlots[slot] || 0) + (pts || 0);
                                }
                            }
                        });
                    }
                } else {
                    weeksCount = 1;
                    const weekIdx = parseInt(selection, 10);
                    const weekObj = team.slot_points_per_week?.[weekIdx];
                    if (weekObj) {
                        for (let [slot, pts] of Object.entries(weekObj)) {
                            computedSlots[slot] = pts || 0;
                        }
                    }
                }

                // If metricMode is averages, compute per-game values
                if (metricMode === 'averages' && weeksCount > 0) {
                    slotKeys.forEach(slot => {
                        computedSlots[slot] = computedSlots[slot] / weeksCount;
                    });
                }

                slotKeys.forEach(slot => {
                    grandTotal += computedSlots[slot];
                });

                return {
                    name: team.name || 'Team',
                    owner: getOwnerName(team),
                    logo: team.logo,
                    slots: computedSlots,
                    grandTotal: grandTotal,
                    rawTeam: team
                };
            });

            // Sort data if requested
            if (currentSortColumn) {
                processedTeams.sort((a, b) => {
                    let valA, valB;
                    if (currentSortColumn === 'team') {
                        valA = a.name; valB = b.name;
                    } else if (currentSortColumn === 'owner') {
                        valA = a.owner; valB = b.owner;
                    } else if (currentSortColumn === 'grandTotal') {
                        valA = a.grandTotal; valB = b.grandTotal;
                    } else {
                        valA = a.slots[currentSortColumn] || 0;
                        valB = b.slots[currentSortColumn] || 0;
                    }

                    if (typeof valA === 'string') {
                        return currentSortAscending ? valA.localeCompare(valB) : valB.localeCompare(valA);
                    }
                    return currentSortAscending ? valA - valB : valB - valA;
                });
            }

            const tableBody = document.getElementById('table-body');
            tableBody.innerHTML = '';

            processedTeams.forEach(item => {
                const safeTeamName = escapeHTML(item.name);
                const safeOwnerName = escapeHTML(item.owner);
                let slotCellsHTML = slotKeys.map(slot => `<td>${item.slots[slot].toFixed(2)}</td>`).join('');

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>
                        <div class="team-col">
                            <img class="team-logo" src="${item.logo ? escapeHTML(item.logo) : PLACEHOLDER_LOGO}" alt="${safeTeamName}">
                            <span>${safeTeamName}</span>
                        </div>
                    </td>
                    <td>${safeOwnerName}</td>
                    ${slotCellsHTML}
                    <td style="color: var(--accent); font-weight: bold;">${item.grandTotal.toFixed(2)}</td>
                `;

                const imgElement = tr.querySelector('.team-logo');
                imgElement.addEventListener('error', function() { this.src = PLACEHOLDER_LOGO; }, { once: true });
                tableBody.appendChild(tr);
            });
        }

        function renderCardsView(teams, slotKeys, selection, metricMode) {
            const cardsContainer = document.getElementById('cards-view');
            cardsContainer.innerHTML = '';

            teams.forEach(team => {
                const safeTeamName = escapeHTML(team.name || 'Team');
                const safeOwnerName = escapeHTML(getOwnerName(team));
                const logoUrl = team.logo ? escapeHTML(team.logo) : PLACEHOLDER_LOGO;

                let computedSlots = {};
                slotKeys.forEach(k => computedSlots[k] = 0);
                let weeksCount = 0;
                let grandTotal = 0;

                if (selection === 'season_totals') {
                    if (Array.isArray(team.slot_points_per_week)) {
                        team.slot_points_per_week.forEach(weekObj => {
                            if (weekObj) {
                                weeksCount++;
                                for (let [slot, pts] of Object.entries(weekObj)) {
                                    computedSlots[slot] = (computedSlots[slot] || 0) + (pts || 0);
                                }
                            }
                        });
                    }
                } else {
                    weeksCount = 1;
                    const weekIdx = parseInt(selection, 10);
                    const weekObj = team.slot_points_per
