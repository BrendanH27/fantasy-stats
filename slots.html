<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fantasy League - Points Per Slot Dashboard</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border: #334155;
            --error-bg: #450a0a;
            --error-text: #fca5a5;
            --error-border: #7f1d1d;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 2rem;
        }
        .container {
            max-width: 1300px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 2rem;
        }
        h1 {
            color: var(--accent);
            margin-bottom: 0.5rem;
        }
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .control-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        select {
            background: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 0.6rem 1rem;
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
            cursor: pointer;
        }
        #status-message {
            text-align: center;
            font-size: 1.1rem;
            color: var(--text-sub);
            margin-top: 3rem;
            padding: 1rem;
            border-radius: 8px;
        }
        .status-error {
            background-color: var(--error-bg);
            color: var(--error-text);
            border: 1px solid var(--error-border);
        }
        .table-container {
            overflow-x: auto;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            white-space: nowrap;
        }
        th, td {
            padding: 0.75rem 1rem;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        th {
            background: rgba(0,0,0,0.3);
            color: var(--accent);
            position: sticky;
            top: 0;
            cursor: pointer;
            user-select: none;
            transition: background 0.2s;
        }
        th:hover {
            background: rgba(56, 189, 248, 0.1);
        }
        th span.sort-indicator {
            font-size: 0.8rem;
            margin-left: 0.3rem;
            color: var(--text-sub);
        }
        tr:hover td {
            background: rgba(56, 189, 248, 0.03);
        }
        .team-col {
            font-weight: bold;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .team-logo {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            background: var(--border);
        }
        /* Per Team View Styles */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 1.5rem;
        }
        .team-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .team-card-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.75rem;
        }
        .team-card-header img {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
            background: var(--border);
        }
        .team-card-info h3 {
            margin: 0;
            font-size: 1.1rem;
        }
        .team-card-info span {
            font-size: 0.85rem;
            color: var(--text-sub);
        }
        .slot-pill-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-auto-flow: column; /* Forces items to fill top-to-bottom per column instead of left-to-right */
            gap: 0.5rem;
        }
        .slot-pill {
            background: rgba(0,0,0,0.2);
            padding: 0.5rem 0.75rem;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .slot-pill-label {
            font-size: 0.75rem;
            color: var(--text-sub);
            text-transform: uppercase;
        }
        .slot-pill-value {
            font-size: 1rem;
            font-weight: bold;
            color: var(--accent);
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1 id="league-title">Points Per Slot Dashboard</h1>
            <p style="color: var(--text-sub); margin: 0;">Analyze production breakdowns across individual roster positions and starting slots.</p>
        </header>

        <div id="status-message">Loading slot data...</div>

        <div id="dashboard" class="hidden">
            <div class="controls">
                <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
                    <div class="control-group hidden" id="year-select-container">
                        <label for="year-select">Season: </label>
                        <select id="year-select"></select>
                    </div>
                    <div class="control-group">
                        <label for="week-select">View Segment: </label>
                        <select id="week-select"></select>
                    </div>
                    <div class="control-group">
                        <label for="calc-mode-select">Display Mode: </label>
                        <select id="calc-mode-select">
                            <option value="totals">Totals</option>
                            <option value="average" selected>Per-Game Average</option>
                        </select>
                    </div>
                </div>
                <div class="control-group">
                    <label for="view-style-select">Layout Style: </label>
                    <select id="view-style-select">
                        <option value="table" selected>League-Wide Table</option>
                        <option value="cards">Per-Team Cards</option>
                    </select>
                </div>
            </div>

            <!-- Table View -->
            <div id="table-view" class="table-container">
                <table>
                    <thead>
                        <tr id="table-head-row">
                            <th data-sort="team">Team <span class="sort-indicator"></span></th>
                            <th data-sort="owner">Owner <span class="sort-indicator"></span></th>
                        </tr>
                    </thead>
                    <tbody id="table-body"></tbody>
                </table>
            </div>

            <!-- Cards View (Per-Team View) -->
            <div id="cards-view" class="grid hidden"></div>
        </div>
    </div>

    <script>
        let rawJSONData = null;
        let activeLeagueData = null;
        let currentSortColumn = null;
        let currentSortDirection = 'desc'; // 'asc' or 'desc'

        const PREFERRED_SLOT_ORDER = ['QB', 'RB1', 'RB2', 'WR1', 'WR2', 'TE', 'FLEX1', 'FLEX2', 'K', 'D/ST', 'DST'];
        const PLACEHOLDER_LOGO = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32"><circle cx="16" cy="16" r="16" fill="%23334155"/><text x="50%" y="50%" dominant-baseline="central" text-anchor="middle" fill="%2394a3b8" font-size="10" font-family="sans-serif">LOGO</text></svg>';

        function escapeHTML(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        window.addEventListener('DOMContentLoaded', () => {
            if (window.location.protocol === 'file:') {
                showError("Cannot fetch JSON using file:// protocol. Please open via local web server (e.g., Live Server in VS Code).");
                return;
            }
            fetch('./league_data.json')
                .then(response => {
                    if (!response.ok) throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    return response.json();
                })
                .then(data => {
                    rawJSONData = data;
                    initYearAndDashboard();
                })
                .catch(error => {
                    console.error("Error loading JSON:", error);
                    showError(`Failed to load 'league_data.json': ${error.message}`);
                });
        });

        function showError(msg) {
            const statusMsg = document.getElementById('status-message');
            statusMsg.textContent = msg;
            statusMsg.classList.add('status-error');
            statusMsg.classList.remove('hidden');
            document.getElementById('dashboard').classList.add('hidden');
        }

        function initYearAndDashboard() {
            if (!rawJSONData) return;
            let rootData = rawJSONData.data || rawJSONData;
            let years = [];

            if (!Array.isArray(rootData) && typeof rootData === 'object') {
                const keys = Object.keys(rootData);
                years = keys.filter(k => !isNaN(parseInt(k, 10))).sort((a, b) => b - a);
            }

            const yearSelectContainer = document.getElementById('year-select-container');
            const yearSelect = document.getElementById('year-select');

            if (years.length > 0) {
                yearSelect.innerHTML = years.map(y => `<option value="${y}">Season ${y}</option>`).join('');
                yearSelectContainer.classList.remove('hidden');
                yearSelect.onchange = (e) => {
                    activeLeagueData = rootData[e.target.value];
                    setupWeekSelectorAndRender();
                };
                activeLeagueData = rootData[years[0]];
            } else {
                yearSelectContainer.classList.add('hidden');
                activeLeagueData = rootData;
            }
            setupWeekSelectorAndRender();
        }

        function setupWeekSelectorAndRender() {
            if (!activeLeagueData || !activeLeagueData.teams) {
                showError("JSON structure missing expected 'teams' object.");
                return;
            }

            document.getElementById('status-message').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
            document.getElementById('league-title').textContent = (activeLeagueData.league_name || "Fantasy League") + " - Points Per Slot";

            const teams = Object.values(activeLeagueData.teams);
            if (teams.length === 0) return;

            const totalWeeks = teams[0].slot_points_per_week ? teams[0].slot_points_per_week.length : 0;
            const weekSelect = document.getElementById('week-select');
            weekSelect.innerHTML = '';

            const seasonOpt = document.createElement('option');
            seasonOpt.value = 'season_totals';
            seasonOpt.textContent = `All Weeks (1–${totalWeeks})`;
            weekSelect.appendChild(seasonOpt);

            for (let i = 1; i <= totalWeeks; i++) {
                const opt = document.createElement('option');
                opt.value = i - 1;
                opt.textContent = `Week ${i}`;
                weekSelect.appendChild(opt);
            }

            weekSelect.onchange = triggerRender;
            document.getElementById('calc-mode-select').onchange = triggerRender;
            document.getElementById('view-style-select').onchange = toggleViewStyle;

            triggerRender();
        }

        function triggerRender() {
            renderSlotData();
        }

        function toggleViewStyle(e) {
            const style = e.target.value;
            if (style === 'cards') {
                document.getElementById('cards-view').classList.remove('hidden');
                document.getElementById('table-view').classList.add('hidden');
            } else {
                document.getElementById('cards-view').classList.add('hidden');
                document.getElementById('table-view').classList.remove('hidden');
            }
            renderSlotData();
        }

        function getProcessedTeamSlotData(team) {
            const selection = document.getElementById('week-select').value;
            const mode = document.getElementById('calc-mode-select').value;

            let slotKeysSet = new Set();
            if (Array.isArray(team.slot_points_per_week)) {
                team.slot_points_per_week.forEach(wObj => {
                    if (wObj) Object.keys(wObj).forEach(s => slotKeysSet.add(s));
                });
            }
            
            let slotKeys = Array.from(slotKeysSet).sort((a, b) => {
                let indexA = PREFERRED_SLOT_ORDER.indexOf(a.toUpperCase());
                let indexB = PREFERRED_SLOT_ORDER.indexOf(b.toUpperCase());
                if (indexA === -1) indexA = 999;
                if (indexB === -1) indexB = 999;
                if (indexA !== indexB) return indexA - indexB;
                return a.localeCompare(b);
            });

            let computedSlots = {};
            slotKeys.forEach(k => computedSlots[k] = 0);
            let gameCount = 0;

            if (selection === 'season_totals') {
                if (Array.isArray(team.slot_points_per_week)) {
                    team.slot_points_per_week.forEach(weekObj => {
                        if (weekObj) {
                            gameCount++;
                            for (let [slot, pts] of Object.entries(weekObj)) {
                                computedSlots[slot] = (computedSlots[slot] || 0) + (pts || 0);
                            }
                        }
                    });
                }
            } else {
                const weekIdx = parseInt(selection, 10);
                const weekObj = team.slot_points_per_week?.[weekIdx];
                gameCount = 1;
                if (weekObj) {
                    for (let [slot, pts] of Object.entries(weekObj)) {
                        computedSlots[slot] = pts || 0;
                    }
                }
            }

            let grandTotal = 0;
            slotKeys.forEach(slot => {
                if (mode === 'average' && gameCount > 0) {
                    computedSlots[slot] = computedSlots[slot] / gameCount;
                }
                grandTotal += computedSlots[slot];
            });

            let ownerName = 'Unknown';
            if (team.owner && team.owner[0]) {
                ownerName = `${team.owner[0].firstName || ''} ${team.owner[0].lastName || ''}`.trim() || team.owner[0].displayName || 'Unknown';
            } else if (typeof team.owner === 'string') {
                ownerName = team.owner;
            }

            return {
                teamName: team.name || 'Team',
                ownerName: ownerName,
                logo: team.logo || '',
                slots: computedSlots,
                slotKeys: slotKeys,
                grandTotal: grandTotal
            };
        }

        function renderSlotData() {
            const teamsObj = activeLeagueData.teams;
            const teamsArray = Object.values(teamsObj);
            if (teamsArray.length === 0) return;

            let sampleTeamProcessed = getProcessedTeamSlotData(teamsArray[0]);
            let slotKeys = sampleTeamProcessed.slotKeys;

            let processedTeams = teamsArray.map(team => getProcessedTeamSlotData(team));

            if (currentSortColumn) {
                processedTeams.sort((a, b) => {
                    let valA, valB;
                    if (currentSortColumn === 'team') {
                        valA = a.teamName.toLowerCase();
                        valB = b.teamName.toLowerCase();
                    } else if (currentSortColumn === 'owner') {
                        valA = a.ownerName.toLowerCase();
                        valB = b.ownerName.toLowerCase();
                    } else if (currentSortColumn === 'total') {
                        valA = a.grandTotal;
                        valB = b.grandTotal;
                    } else {
                        valA = a.slots[currentSortColumn] || 0;
                        valB = b.slots[currentSortColumn] || 0;
                    }

                    if (valA < valB) return currentSortDirection === 'asc' ? -1 : 1;
                    if (valA > valB) return currentSortDirection === 'asc' ? 1 : -1;
                    return 0;
                });
            }

            // 1. Render Table View
            const theadRow = document.getElementById('table-head-row');
            theadRow.innerHTML = `
                <th data-sort="team">Team <span class="sort-indicator">${currentSortColumn === 'team' ? (currentSortDirection === 'asc' ? '▲' : '▼') : ''}</span></th>
                <th data-sort="owner">Owner <span class="sort-indicator">${currentSortColumn === 'owner' ? (currentSortDirection === 'asc' ? '▲' : '▼') : ''}</span></th>
                ${slotKeys.map(slot => `<th data-sort="${slot}">${escapeHTML(slot)} <span class="sort-indicator">${currentSortColumn === slot ? (currentSortDirection === 'asc' ? '▲' : '▼') : ''}</span></th>`).join('')}
                <th data-sort="total" style="color: var(--accent);">Total <span class="sort-indicator">${currentSortColumn === 'total' ? (currentSortDirection === 'asc' ? '▲' : '▼') : ''}</span></th>
            `;

            theadRow.querySelectorAll('th').forEach(th => {
                th.onclick = () => {
                    const sortKey = th.getAttribute('data-sort');
                    if (currentSortColumn === sortKey) {
                        currentSortDirection = currentSortDirection === 'asc' ? 'desc' : 'asc';
                    } else {
                        currentSortColumn = sortKey;
                        currentSortDirection = 'desc';
                    }
                    renderSlotData();
                };
            });

            const tableBody = document.getElementById('table-body');
            tableBody.innerHTML = '';

            processedTeams.forEach(data => {
                const safeTeamName = escapeHTML(data.teamName);
                const safeOwnerName = escapeHTML(data.ownerName);
                let slotCellsHTML = slotKeys.map(slot => `<td>${(data.slots[slot] || 0).toFixed(2)}</td>`).join('');

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>
                        <div class="team-col">
                            <img class="team-logo" src="${data.logo ? escapeHTML(data.logo) : PLACEHOLDER_LOGO}" alt="${safeTeamName}">
                            <span>${safeTeamName}</span>
                        </div>
                    </td>
                    <td>${safeOwnerName}</td>
                    ${slotCellsHTML}
                    <td style="color: var(--accent); font-weight: bold;">${data.grandTotal.toFixed(2)}</td>
                `;

                const img = tr.querySelector('.team-logo');
                img.addEventListener('error', function() { this.src = PLACEHOLDER_LOGO; }, { once: true });
                tableBody.appendChild(tr);
            });

            // 2. Render Cards View
            const cardsContainer = document.getElementById('cards-view');
            cardsContainer.innerHTML = '';

            processedTeams.forEach(data => {
                const safeTeamName = escapeHTML(data.teamName);
                const safeOwnerName = escapeHTML(data.ownerName);

                const card = document.createElement('div');
                card.className = 'team-card';

                let pillsHTML = slotKeys.map(slot => `
                    <div class="slot-pill">
                        <span class="slot-pill-label">${escapeHTML(slot)}</span>
                        <span class="slot-pill-value">${(data.slots[slot] || 0).toFixed(2)}</span>
                    </div>
                `).join('');

                card.innerHTML = `
                    <div class="team-card-header">
                        <img src="${data.logo ? escapeHTML(data.logo) : PLACEHOLDER_LOGO}" alt="${safeTeamName}">
                        <div class="team-card-info">
                            <h3>${safeTeamName}</h3>
                            <span>Owner: ${safeOwnerName}</span>
                        </div>
                    </div>
                    <div class="slot-pill-grid">
                        ${pillsHTML}
                    </div>
                    <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border); padding-top: 0.5rem; font-weight: bold;">
                        <span>Total Production</span>
                        <span style="color: var(--accent); font-size: 1.1rem;">${data.grandTotal.toFixed(2)}</span>
                    </div>
                `;

                const cardImg = card.querySelector('img');
                cardImg.addEventListener('error', function() { this.src = PLACEHOLDER_LOGO; }, { once: true });
                cardsContainer.appendChild(card);
            });
        }
    </script>
</body>
</html>
